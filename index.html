<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#191512">
<meta name="description" content="依男女歌手、心情、曲風、年代挑歌，一鍵在 YouTube 開始播放">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心情點唱機">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<title>心情點唱機 - 音樂標籤與行動播放</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src https://docs.google.com https://*.google.com https://*.googleusercontent.com; img-src data: https://i.ytimg.com https://img.youtube.com; form-action 'none'; base-uri 'none'">
</head>
<body>
<style>
  :root {
    --ground:   #191512;
    --panel:    #241E1A;
    --panel-hi: #2E2620;
    --line:     #3A3029;
    --ink:      #F2EBE3;
    --ink-dim:  #9A8F86;
    --brass:    #C9A227;
    --brass-lo: #8A6F1B;
    --sage:     #7D9471;
    --red:      #C85A5A;
    --sans: "PingFang TC", "Noto Sans TC", "Hiragino Sans", "Microsoft JhengHei",
            -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 7rem;
  }

  .wrap { max-width: 36rem; margin: 0 auto; padding: 0 1rem; }

  /* ── 頂部設定提示與門檻面板 ── */
  .gate {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    padding: 1.25rem;
    margin: 1.2rem 0;
  }
  .gate-title {
    font-size: 1.15rem; font-weight: 700; color: var(--brass); margin: 0 0 0.5rem;
  }
  .gate-body { font-size: 0.88rem; color: var(--ink-dim); line-height: 1.6; margin-bottom: 0.85rem; }
  .gate-input {
    width: 100%;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 0.45rem;
    padding: 0.65rem 0.8rem;
    font-size: 0.9rem;
    font-family: var(--mono);
    margin-bottom: 0.6rem;
  }
  .gate-input:focus { outline: none; border-color: var(--brass); }
  .gate-actions { display: flex; gap: 0.5rem; }
  .btn-primary {
    background: var(--brass); color: #191512; font-weight: 600;
    border: none; border-radius: 0.45rem; padding: 0.6rem 1.2rem; cursor: pointer;
  }
  .btn-subtle {
    background: transparent; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 0.45rem; padding: 0.6rem 1rem; cursor: pointer;
  }

  /* ── 讀數面板（置頂）── */
  .readout {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 8px 24px -12px #000;
  }
  .readout-inner {
    max-width: 36rem; margin: 0 auto; padding: 0.8rem 1rem;
    display: flex; flex-direction: column; gap: 0.75rem;
  }
  .dial-row { display: flex; align-items: baseline; justify-content: space-between; }
  .dial { display: flex; align-items: baseline; gap: 0.5rem; }
  .dial-num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 2.5rem; font-weight: 700; line-height: 1;
    color: var(--brass);
  }
  .dial-num.zero { color: var(--ink-dim); }
  .dial-unit { font-size: 0.95rem; color: var(--ink-dim); }
  .dial-stat { font-size: 0.75rem; color: var(--ink-dim); }

  .actions { display: flex; gap: 0.5rem; }
  button {
    font-family: inherit; font-size: 0.95rem; cursor: pointer;
    border-radius: 0.5rem; border: 1px solid transparent;
    padding: 0.65rem 0.9rem; transition: all 0.15s ease;
  }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .btn-play {
    flex: 2; background: var(--brass); color: #191512; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  }
  .btn-play:disabled { background: var(--line); color: var(--ink-dim); cursor: not-allowed; }
  .btn-play:not(:disabled):active { filter: brightness(0.9); }
  .btn-reroll {
    flex: 1; background: var(--panel-hi); color: var(--ink); border-color: var(--line);
    display: flex; align-items: center; justify-content: center; gap: 0.3rem;
  }
  .btn-reroll:active { background: var(--line); }
  .btn-embed-toggle {
    background: transparent; color: var(--ink-dim); border-color: var(--line); padding: 0.65rem;
  }
  .btn-embed-toggle[aria-pressed="true"] {
    background: var(--sage); border-color: var(--sage); color: #16190F;
  }

  /* ── 搜尋欄 ── */
  .search { position: relative; margin-top: 1rem; }
  .search input {
    width: 100%; font-family: inherit; font-size: 0.95rem;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 0.5rem;
    padding: 0.65rem 2.2rem 0.65rem 0.85rem;
  }
  .search input::placeholder { color: var(--ink-dim); }
  .search input:focus { outline: none; border-color: var(--brass-lo); }
  .search-clear {
    position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--ink-dim);
    font-size: 1.2rem; padding: 0.3rem 0.5rem;
  }

  /* ── 標籤分類組 ── */
  .group { margin-top: 1.25rem; }
  .group-head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.5rem; }
  .group-label {
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .group-hint { font-size: 0.7rem; color: var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 1.4rem;
    padding: 0.4rem 0.8rem; font-size: 0.9rem;
    display: inline-flex; align-items: center;
  }
  .chip .n {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 0.75rem; color: var(--ink-dim); margin-left: 0.35rem;
  }
  .chip[aria-pressed="true"] {
    background: var(--sage); border-color: var(--sage); color: #16190F; font-weight: 600;
  }
  .chip[aria-pressed="true"] .n { color: #16190F; opacity: 0.65; }
  .chip:disabled { opacity: 0.28; cursor: not-allowed; }

  .reset-btn {
    margin-top: 1rem; background: none; border: none;
    color: var(--ink-dim); font-size: 0.85rem;
    padding: 0.3rem 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }

  /* ── 收錄歌曲預覽列表 ── */
  .preview { margin-top: 1.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .preview-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .track {
    display: flex; gap: 0.75rem; align-items: flex-start;
    padding: 0.65rem 0; border-bottom: 1px solid var(--panel);
  }
  .track-num {
    font-family: var(--mono); font-size: 0.75rem; color: var(--line);
    min-width: 1.8rem; text-align: right; padding-top: 0.2rem;
  }
  .track-body { flex: 1; min-width: 0; }
  .track-title { font-size: 0.92rem; font-weight: 600; line-height: 1.35; word-break: break-word; }
  .track-artist { font-size: 0.78rem; color: var(--ink-dim); margin-top: 0.15rem; }
  .track-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.35rem; }
  .tag-badge {
    font-size: 0.68rem; padding: 0.15rem 0.45rem; border-radius: 0.6rem;
    background: var(--ground); color: var(--ink-dim); border: 1px solid var(--line);
  }
  .tag-badge.key { color: var(--brass); border-color: var(--brass-lo); }

  /* ── 底部內嵌播放器 ── */
  .mini-player {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: #15110E; border-top: 1px solid var(--line);
    padding: 0.75rem 1rem max(0.75rem, env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px -6px rgba(0,0,0,0.85);
  }
  .mini-player[hidden] { display: none; }
  .mini-inner {
    max-width: 36rem; margin: 0 auto;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .player-frame-box {
    width: 56px; height: 38px; background: #000; border-radius: 0.3rem; overflow: hidden; flex: none;
  }
  .player-frame-box iframe { width: 100%; height: 100%; border: none; }
  .player-meta { flex: 1; min-width: 0; }
  .player-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-sub { font-size: 0.72rem; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-ctrls { display: flex; gap: 0.4rem; align-items: center; flex: none; }
  .btn-ctrl {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 50%; width: 34px; height: 34px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
</style>

<div class="readout">
  <div class="readout-inner">
    <div class="dial-row">
      <div class="dial">
        <span class="dial-num zero" id="count">0</span>
        <span class="dial-unit">首選取</span>
      </div>
      <div class="dial-stat" id="total-stat">載入中...</div>
    </div>
    <div class="actions">
      <button class="btn-play" id="btn-yt" disabled>
        ▶ 在 YouTube 播放 (<span id="play-count">0</span>)
      </button>
      <button class="btn-reroll" id="btn-reroll" style="display:none;" title="符合超過50首，隨機換下一批">
        🔄 換一批
      </button>
      <button class="btn-embed-toggle" id="btn-embed" aria-pressed="false" title="在網頁內嵌播放器播放">
        🎧 內嵌
      </button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- 連線設定區域（若無 Sheet ID 則顯示） -->
  <div class="gate" id="gate">
    <div class="gate-title">連接你的 Google 試算表</div>
    <div class="gate-body">
      輸入你的 Google 試算表 ID 或發布連結。試算表請先設為「知道連結的使用者可檢視」或「發布到網路」。
    </div>
    <input type="text" id="input-sheet-id" class="gate-input" placeholder="例如：1A2b3C4d5E6f7G8h9I0jK-L_M...">
    <div class="gate-actions">
      <button class="btn-primary" id="btn-connect">連接試算表</button>
      <button class="btn-subtle" id="btn-reset-sheet" style="display:none;">清除設定</button>
    </div>
    <div id="gate-msg" style="margin-top:0.6rem; font-size:0.8rem; color:var(--brass);"></div>
  </div>

  <!-- 關鍵字即時搜尋 -->
  <div class="search">
    <input type="search" id="search-input" placeholder="搜尋歌名、歌手、頻道或標籤...">
    <button class="search-clear" id="search-clear" hidden>×</button>
  </div>

  <!-- 分類篩選按鈕群組 -->
  <div id="groups"></div>

  <button class="reset-btn" id="btn-clear-filters" hidden>清除全部篩選條件</button>

  <!-- 曲目預覽 -->
  <div class="preview">
    <div class="list-head">
      <div class="preview-label">目前過濾曲目清單 (<span id="preview-count">0</span>)</div>
    </div>
    <div id="track-list"></div>
  </div>
</div>

<!-- 底部內嵌 Mini Player -->
<div class="mini-player" id="mini-player" hidden>
  <div class="mini-inner">
    <div class="player-frame-box" id="player-mount"></div>
    <div class="player-meta">
      <div class="player-title" id="now-title">點唱機就緒</div>
      <div class="player-sub" id="now-artist">選取曲目開始播放</div>
    </div>
    <div class="player-ctrls">
      <button class="btn-ctrl" id="btn-prev" title="上一首">⏮</button>
      <button class="btn-ctrl" id="btn-toggle" title="播放/暫停">▶</button>
      <button class="btn-ctrl" id="btn-next" title="下一首">⏭</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  const LS_KEY = "music_jukebox_sheet_id";
  const PLAY_CAP = 50;

  // 標準分類定義（當試算表標頭包含時自動分類）
  const DEFAULT_TAXONOMY = {
    "語言": ["中文", "英文", "日文", "韓文", "粵語", "純音樂", "其他"],
    "男女歌手": ["男歌手", "女歌手", "男女合唱", "樂團/組合", "純音樂"],
    "年代": ["70s以前", "80s", "90s", "2000s", "2010s", "2020s"],
    "曲風": ["流行", "搖滾", "爵士", "Indie", "電子", "R&B", "古典", "嘻哈/饒舌", "民謠", "ACG"],
    "心情": ["放鬆", "嗨歌", "悲傷", "浪漫", "振奮", "療癒", "孤獨"],
    "情境": ["開車", "工作", "運動", "睡前", "派對", "通勤"]
  };

  const SINGLE_CATS = new Set(["語言", "男女歌手", "年代"]);

  let state = {
    allSongs: [],
    categories: {}, // { "語言": ["中文", "英文"...] }
    selectedTags: new Set(),
    searchQuery: "",
    matchingSongs: [],
    active50: [],
    inAppMode: false,
    currentPlayingIndex: 0
  };

  // DOM 元素
  const gateEl = document.getElementById("gate");
  const sheetInputEl = document.getElementById("input-sheet-id");
  const connectBtn = document.getElementById("btn-connect");
  const resetSheetBtn = document.getElementById("btn-reset-sheet");
  const gateMsgEl = document.getElementById("gate-msg");

  const countEl = document.getElementById("count");
  const playCountEl = document.getElementById("play-count");
  const totalStatEl = document.getElementById("total-stat");
  const btnYt = document.getElementById("btn-yt");
  const btnReroll = document.getElementById("btn-reroll");
  const btnEmbed = document.getElementById("btn-embed");
  const searchInput = document.getElementById("search-input");
  const searchClear = document.getElementById("search-clear");
  const groupsEl = document.getElementById("groups");
  const clearFiltersBtn = document.getElementById("btn-clear-filters");
  const trackListEl = document.getElementById("track-list");
  const previewCountEl = document.getElementById("preview-count");

  // Mini Player DOM
  const miniPlayerEl = document.getElementById("mini-player");
  const playerMount = document.getElementById("player-mount");
  const nowTitle = document.getElementById("now-title");
  const nowArtist = document.getElementById("now-artist");
  const btnPrev = document.getElementById("btn-prev");
  const btnToggle = document.getElementById("btn-toggle");
  const btnNext = document.getElementById("btn-next");

  // 1. 初始化與參數讀取
  const urlParams = new URLSearchParams(window.location.search);
  const paramId = urlParams.get("id");
  const savedId = paramId || localStorage.getItem(LS_KEY) || "";

  if (savedId) {
    sheetInputEl.value = savedId;
    loadSheet(savedId);
  }

  connectBtn.addEventListener("click", () => {
    const val = sheetInputEl.value.trim();
    if (!val) {
      showGateMsg("請輸入試算表 ID 或網址", true);
      return;
    }
    loadSheet(val);
  });

  resetSheetBtn.addEventListener("click", () => {
    localStorage.removeItem(LS_KEY);
    sheetInputEl.value = "";
    resetSheetBtn.style.display = "none";
    showGateMsg("已清除連線資訊，請重新輸入");
  });

  function showGateMsg(txt, isErr) {
    gateMsgEl.textContent = txt;
    gateMsgEl.style.color = isErr ? "var(--red)" : "var(--brass)";
  }

  // 2. 試算表載入引擎（官方 gviz 模式，零 Apps Script）
  function extractSpreadsheetId(str) {
    // 支援直接輸入 ID，或完整的 docs.google.com/spreadsheets/d/ID/... 網址
    const m = str.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    return m ? m[1] : str.trim();
  }

  async function loadSheet(rawInput) {
    const sid = extractSpreadsheetId(rawInput);
    if (!sid) return;

    showGateMsg("正在連線試算表資料庫...");
    connectBtn.disabled = true;

    // 支援 Google Visualization API (gviz)
    const gvizUrl = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:json`;

    try {
      const resp = await fetch(gvizUrl);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();

      // 解析 gviz 傳回之 JSON 結構 /*O_o*/ google.visualization.Query.setResponse({...});
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");
      if (start === -1 || end === -1) throw new Error("無效的試算表回應");
      const json = JSON.parse(text.substring(start, end + 1));

      parseGvizData(json);
      localStorage.setItem(LS_KEY, sid);
      gateEl.style.display = "none";
      resetSheetBtn.style.display = "inline-block";
    } catch (e) {
      console.error(e);
      showGateMsg("連線失敗：請確認試算表已開啟「知道連結的使用者可檢視」或「發布到網路」", true);
      connectBtn.disabled = false;
    }
  }

  function parseGvizData(json) {
    const table = json.table;
    if (!table || !table.cols || !table.rows) {
      showGateMsg("試算表內容為空", true);
      return;
    }

    // 優先用 cols[].label；若試算表未設欄標籤（label 全為空），
    // 則 fallback 取第一個 row 作為 header，並把該 row 從資料列中移除。
    let header = table.cols.map(c => (c.label || "").trim());
    let dataRows = table.rows;

    const hasLabel = header.some(h => h !== "");
    if (!hasLabel && dataRows.length > 0) {
      const firstRow = dataRows[0];
      if (firstRow && firstRow.c) {
        header = firstRow.c.map(cell => (cell && cell.v != null ? String(cell.v).trim() : ""));
        dataRows = dataRows.slice(1); // 移除 header row，避免當成歌曲資料
      }
    }

    const colIdx = {};
    header.forEach((name, i) => { if (name) colIdx[name] = i; });

    if (!("videoId" in colIdx)) {
      showGateMsg("試算表缺少 videoId 欄位", true);
      return;
    }

    const songs = [];
    const usedTags = {};

    dataRows.forEach(r => {
      if (!r.c) return;
      const getVal = (name) => {
        const idx = colIdx[name];
        if (idx === undefined || !r.c[idx]) return "";
        return String(r.c[idx].v || "").trim();
      };

      const vid = getVal("videoId");
      if (!vid) return;
      if (getVal("非音樂").toUpperCase() === "Y") return;

      const title = getVal("歌名") || getVal("曲名") || "未命名曲目";
      const artist = getVal("歌手/原唱") || getVal("原唱") || getVal("歌手") || "";
      const channel = getVal("頻道") || "";

      // 擷取所有標籤
      const tags = [];
      Object.keys(DEFAULT_TAXONOMY).forEach(cat => {
        if (cat in colIdx) {
          const val = getVal(cat);
          if (val) {
            val.replace(/,/g, "、").split("、").forEach(t => {
              const cleaned = t.trim();
              if (cleaned && !tags.includes(cleaned)) {
                tags.push(cleaned);
                usedTags[cleaned] = (usedTags[cleaned] || 0) + 1;
              }
            });
          }
        }
      });

      // 支援任何其他非固定欄位標籤
      Object.keys(colIdx).forEach(cat => {
        if (!["videoId", "歌名", "曲名", "歌手/原唱", "原唱", "歌手", "頻道", "來源清單", "非音樂", "年份", "更新時間"].includes(cat) && !DEFAULT_TAXONOMY[cat]) {
          const val = getVal(cat);
          if (val) {
            val.replace(/,/g, "、").split("、").forEach(t => {
              const cleaned = t.trim();
              if (cleaned && !tags.includes(cleaned)) {
                tags.push(cleaned);
                usedTags[cleaned] = (usedTags[cleaned] || 0) + 1;
              }
            });
          }
        }
      });

      songs.push({
        id: vid,
        title: title,
        artist: artist,
        channel: channel,
        tags: tags
      });
    });

    state.allSongs = songs;

    // 建立可用的分類集合（僅保留有實際曲目出現的標籤）
    state.categories = {};
    Object.entries(DEFAULT_TAXONOMY).forEach(([cat, list]) => {
      const activeList = list.filter(t => usedTags[t]);
      if (activeList.length) {
        state.categories[cat] = activeList;
      }
    });

    // 額外自訂標籤
    const customTags = Object.keys(usedTags).filter(t => !Object.values(DEFAULT_TAXONOMY).some(list => list.includes(t)));
    if (customTags.length) {
      state.categories["自訂"] = customTags;
    }

    renderGroups();
    applyFilter();
  }

  // 3. 渲染篩選群組 UI
  function renderGroups() {
    groupsEl.innerHTML = "";
    Object.entries(state.categories).forEach(([cat, tags]) => {
      const g = document.createElement("div");
      g.className = "group";
      const head = document.createElement("div");
      head.className = "group-head";
      head.innerHTML = `<span class="group-label">${cat}</span><span class="group-hint">${SINGLE_CATS.has(cat) ? "單選" : "多選"}</span>`;
      g.appendChild(head);

      const chipsBox = document.createElement("div");
      chipsBox.className = "chips";

      tags.forEach(tag => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.dataset.cat = cat;
        btn.dataset.tag = tag;
        btn.setAttribute("aria-pressed", state.selectedTags.has(tag) ? "true" : "false");
        btn.innerHTML = `${tag}<span class="n" id="chip-n-${encodeURIComponent(tag)}">0</span>`;

        btn.addEventListener("click", () => toggleTag(cat, tag));
        chipsBox.appendChild(btn);
      });

      g.appendChild(chipsBox);
      groupsEl.appendChild(g);
    });
  }

  function toggleTag(cat, tag) {
    if (state.selectedTags.has(tag)) {
      state.selectedTags.delete(tag);
    } else {
      // 若為單選類別，先移除該類別其他標籤
      if (SINGLE_CATS.has(cat)) {
        (state.categories[cat] || []).forEach(t => state.selectedTags.delete(t));
      }
      state.selectedTags.add(tag);
    }
    updateChipsUI();
    applyFilter();
  }

  function updateChipsUI() {
    document.querySelectorAll(".chip").forEach(chip => {
      const tag = chip.dataset.tag;
      chip.setAttribute("aria-pressed", state.selectedTags.has(tag) ? "true" : "false");
    });
    clearFiltersBtn.hidden = state.selectedTags.size === 0 && !state.searchQuery;
  }

  clearFiltersBtn.addEventListener("click", () => {
    state.selectedTags.clear();
    state.searchQuery = "";
    searchInput.value = "";
    searchClear.hidden = true;
    updateChipsUI();
    applyFilter();
  });

  // 4. 關鍵字搜尋事件
  searchInput.addEventListener("input", (e) => {
    state.searchQuery = e.target.value.trim().toLowerCase();
    searchClear.hidden = !state.searchQuery;
    clearFiltersBtn.hidden = state.selectedTags.size === 0 && !state.searchQuery;
    applyFilter();
  });

  searchClear.addEventListener("click", () => {
    state.searchQuery = "";
    searchInput.value = "";
    searchClear.hidden = true;
    clearFiltersBtn.hidden = state.selectedTags.size === 0;
    applyFilter();
  });

  // 5. 核心過濾邏輯（類別間 AND，類別內 OR）
  function applyFilter() {
    const selected = Array.from(state.selectedTags);
    const q = state.searchQuery;

    // 將選取的標籤依類別分組
    const catPicks = {};
    selected.forEach(t => {
      for (const [cat, tags] of Object.entries(state.categories)) {
        if (tags.includes(t)) {
          catPicks[cat] = catPicks[cat] || [];
          catPicks[cat].push(t);
          break;
        }
      }
    });

    const activeCats = Object.values(catPicks);

    state.matchingSongs = state.allSongs.filter(song => {
      // 關鍵字搜尋匹配
      if (q) {
        const text = `${song.title} ${song.artist} ${song.channel} ${song.tags.join(" ")}`.toLowerCase();
        if (!text.includes(q)) return false;
      }

      // 標籤篩選：必須滿足每一個有選取標籤的類別（類別間 AND，類別內 OR）
      for (const groupTags of activeCats) {
        const hasAnyInGroup = groupTags.some(t => song.tags.includes(t));
        if (!hasAnyInGroup) return false;
      }
      return true;
    });

    // 隨機抽選 50 首作為播放目標
    shuffle50();
    updateCounts();
    renderTrackList();
  }

  function shuffle50() {
    const pool = [...state.matchingSongs];
    // Fisher-Yates shuffle
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.active50 = pool.slice(0, PLAY_CAP);
  }

  btnReroll.addEventListener("click", () => {
    shuffle50();
    renderTrackList();
    if (state.inAppMode) {
      loadInAppVideo(0);
    }
  });

  // 6. 介面計數更新
  function updateCounts() {
    const count = state.matchingSongs.length;
    countEl.textContent = count;
    countEl.className = "dial-num" + (count === 0 ? " zero" : "");
    playCountEl.textContent = Math.min(count, PLAY_CAP);
    previewCountEl.textContent = count;
    totalStatEl.textContent = `媒體庫總計 ${state.allSongs.length} 首`;

    btnYt.disabled = count === 0;
    btnReroll.style.display = count > PLAY_CAP ? "flex" : "none";

    // 更新每個 Chip 上的預估匹配數
    document.querySelectorAll(".chip").forEach(chip => {
      const tag = chip.dataset.tag;
      const countForTag = state.allSongs.filter(s => s.tags.includes(tag)).length;
      const badge = document.getElementById(`chip-n-${encodeURIComponent(tag)}`);
      if (badge) badge.textContent = countForTag;
    });
  }

  // 7. 渲染曲目列表
  function renderTrackList() {
    trackListEl.innerHTML = "";
    if (state.matchingSongs.length === 0) {
      trackListEl.innerHTML = `<div style="color:var(--ink-dim); padding:1rem 0; font-size:0.9rem;">沒有符合條件的曲目，請嘗試減少篩選標籤。</div>`;
      return;
    }

    const showList = state.matchingSongs.slice(0, 100);
    showList.forEach((song, idx) => {
      const row = document.createElement("div");
      row.className = "track";

      const tagsHtml = song.tags.map(t => {
        const isKey = ["中文", "英文", "日文", "韓文", "粵語", "純音樂"].includes(t) || t.endsWith("s");
        return `<span class="tag-badge ${isKey ? "key" : ""}">${t}</span>`;
      }).join("");

      row.innerHTML = `
        <div class="track-num">${idx + 1}</div>
        <div class="track-body">
          <div class="track-title">${song.title}</div>
          <div class="track-artist">${song.artist || song.channel}</div>
          <div class="track-tags">${tagsHtml}</div>
        </div>
      `;

      row.addEventListener("click", () => {
        playSingleSong(song.id, song.title, song.artist || song.channel);
      });

      trackListEl.appendChild(row);
    });

    if (state.matchingSongs.length > 100) {
      const more = document.createElement("div");
      more.style.cssText = "text-align:center; padding:0.8rem; color:var(--ink-dim); font-size:0.8rem;";
      more.textContent = `...另有 ${state.matchingSongs.length - 100} 首未在預覽中列出`;
      trackListEl.appendChild(more);
    }
  }

  // 8. 播放模式 A：YouTube App 臨時歌單 (watch_videos)
  btnYt.addEventListener("click", () => {
    if (!state.active50.length) return;
    const vids = state.active50.map(s => s.id).join(",");
    const url = `https://www.youtube.com/watch_videos?video_ids=${vids}`;
    window.open(url, "_blank");
  });

  // 9. 播放模式 B：網頁內嵌播放器 (IFrame)
  btnEmbed.addEventListener("click", () => {
    state.inAppMode = !state.inAppMode;
    btnEmbed.setAttribute("aria-pressed", state.inAppMode ? "true" : "false");
    miniPlayerEl.hidden = !state.inAppMode;
    if (state.inAppMode && state.active50.length) {
      loadInAppVideo(0);
    }
  });

  function playSingleSong(vid, title, artist) {
    state.inAppMode = true;
    btnEmbed.setAttribute("aria-pressed", "true");
    miniPlayerEl.hidden = false;
    nowTitle.textContent = title;
    nowArtist.textContent = artist;
    playerMount.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&enablejsapi=1" allow="autoplay" allowfullscreen></iframe>`;
  }

  function loadInAppVideo(index) {
    if (!state.active50.length) return;
    state.currentPlayingIndex = (index + state.active50.length) % state.active50.length;
    const s = state.active50[state.currentPlayingIndex];
    nowTitle.textContent = s.title;
    nowArtist.textContent = s.artist || s.channel;
    playerMount.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${s.id}?autoplay=1&enablejsapi=1" allow="autoplay" allowfullscreen></iframe>`;
  }

  btnNext.addEventListener("click", () => loadInAppVideo(state.currentPlayingIndex + 1));
  btnPrev.addEventListener("click", () => loadInAppVideo(state.currentPlayingIndex - 1));
  btnToggle.addEventListener("click", () => {
    // 重新載入或暫停
    loadInAppVideo(state.currentPlayingIndex);
  });

})();
</script>
</body>
</html>
