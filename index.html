<body>
<div class="fx" aria-hidden="true">

</div>
<style>
  :root {
    --ground:      #07060e;
    --panel:       rgba(14, 12, 28, 0.58);
    --panel-hi:    rgba(255, 255, 255, 0.08);
    --line:        rgba(255, 255, 255, 0.12);
    --ink:         #F8FAFC;
    --ink-dim:     rgba(226, 232, 240, 0.64);
    --brass:       #34D399;
    --brass-lo:    #10B981;
    --sage:        #A78BFA;
    --on-accent:   #022c22;
    --red:         #FB7185;
    --purple:      #8B5CF6;
    --glass:       linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    --glass-bg:    rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glow-green:  0 0 28px rgba(16, 185, 129, 0.42);
    --glow-purple: 0 0 28px rgba(139, 92, 246, 0.28);
    --sans: "PingFang TC", "Noto Sans TC", "Hiragino Sans", "Microsoft JhengHei",
            -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --blur: blur(22px) saturate(1.45);
  }

  * { box-sizing: border-box; }
  html { overflow-x: hidden; max-width: 100%; background: var(--ground); }
  button, a, input { touch-action: manipulation; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    max-width: 100%;
    min-height: 100dvh;
    padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    position: relative;
  }
  body:not(.no-yt-embed) {
    padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px));
  }

  .fx {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .fx-orb {
    position: absolute; border-radius: 50%;
    filter: blur(72px);
    will-change: transform;
  }
  .fx-orb-a {
    width: 22rem; height: 22rem; top: -7rem; left: -8rem;
    background: #6d28d9; opacity: 0.55;
  }
  .fx-orb-b {
    width: 26rem; height: 26rem; bottom: -9rem; right: -11rem;
    background: #059669; opacity: 0.5;
  }
  .fx-orb-c {
    width: 14rem; height: 14rem; top: 38%; left: 28%;
    background: #4c1d95; opacity: 0.32;
  }
  .fx::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(139, 92, 246, 0.16), transparent 52%),
      radial-gradient(ellipse at 80% 100%, rgba(16, 185, 129, 0.14), transparent 48%),
      radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.55) 100%);
  }

  .wrap, .readout, .mini-player { position: relative; z-index: 1; }
  .wrap {
    max-width: 36rem;
    margin: 0 auto;
    padding: 0 max(1rem, env(safe-area-inset-right, 0px)) 0 max(1rem, env(safe-area-inset-left, 0px));
  }

  .ico { width: 1rem; height: 1rem; fill: currentColor; flex: none; display: block; }

  /* ── 頂部設定提示與門檻面板 ── */
  .gate {
    background: var(--panel);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    border-radius: 1.15rem;
    padding: 1.25rem;
    margin: 1.2rem 0;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.14);
  }
  .gate-title {
    font-size: 1.12rem; font-weight: 700; letter-spacing: -0.02em;
    color: var(--ink); margin: 0 0 0.5rem;
  }
  .gate-body { font-size: 0.88rem; color: var(--ink-dim); line-height: 1.6; margin-bottom: 0.85rem; }
  .gate-label {
    display: block; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0.55rem 0 0.3rem;
  }
  .gate-input {
    width: 100%;
    background: rgba(0,0,0,0.28);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 0.85rem;
    padding: 0.75rem 0.9rem;
    font-size: 16px;
    font-family: var(--mono);
    margin-bottom: 0;
  }
  .gate-input:focus { outline: none; border-color: rgba(52, 211, 153, 0.55); box-shadow: var(--glow-green); }
  .extracted-hint {
    margin-top: 0.45rem; font-size: 0.78rem; color: var(--brass);
    word-break: break-all; line-height: 1.45;
  }
  .extracted-hint[hidden] { display: none; }
  .gate-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
  .gate-actions .btn-primary, .gate-actions .btn-subtle { min-height: 44px; }
  .btn-primary {
    background: linear-gradient(180deg, #6ee7b7, #10b981);
    color: var(--on-accent); font-weight: 700;
    border: none; border-radius: 500px; padding: 0.6rem 1.25rem; cursor: pointer;
    box-shadow: var(--glow-green), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .btn-primary:active { filter: brightness(1.08); }
  .btn-subtle {
    background: var(--glass-bg); color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 500px; padding: 0.6rem 1rem; cursor: pointer;
  }

  /* ── 讀數面板（置頂）── */
  .readout {
    position: sticky; top: 0; z-index: 20;
    background: rgba(7, 6, 14, 0.52);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .readout-inner {
    max-width: 36rem; margin: 0 auto;
    padding: 0.7rem max(1rem, env(safe-area-inset-right, 0px)) 0.85rem max(1rem, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 0.7rem;
  }
  .dial-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .dial { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
  .dial-num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 2.25rem; font-weight: 700; line-height: 1;
    letter-spacing: -0.04em;
    color: #ecfdf5;
    text-shadow: 0 0 22px rgba(52, 211, 153, 0.55);
  }
  .dial-num.zero { color: var(--ink-dim); text-shadow: none; }
  .dial-unit { font-size: 0.82rem; color: var(--ink-dim); letter-spacing: 0.04em; }
  .dial-side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; flex: none; }
  .dial-stat { font-size: 0.72rem; color: var(--ink-dim); text-align: right; }

  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  button {
    font-family: inherit; font-size: 0.95rem; cursor: pointer;
    border-radius: 0.5rem; border: 1px solid transparent;
    padding: 0.65rem 0.85rem; transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    min-height: 44px;
  }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .btn-play {
    flex: 1 1 11rem; min-width: 0;
    background: linear-gradient(180deg, #6ee7b7 0%, #10b981 100%);
    color: var(--on-accent); font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    border-radius: 500px;
    box-shadow: var(--glow-green), 0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.38);
  }
  .btn-play:disabled {
    background: rgba(255,255,255,0.08); color: var(--ink-dim); cursor: not-allowed;
    box-shadow: none;
  }
  .btn-play:not(:disabled):active { filter: brightness(1.06); transform: scale(0.985); }
  .count-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.5rem; height: 1.35rem; padding: 0 0.45rem;
    border-radius: 999px;
    background: rgba(2, 44, 34, 0.22);
    font-family: var(--mono); font-size: 0.75rem; font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .btn-play:disabled .count-pill { background: rgba(255,255,255,0.08); }
  .btn-reroll {
    flex: 0 1 auto;
    background: var(--glass-bg); color: var(--ink);
    border-color: var(--line);
    border-radius: 500px;
    display: flex; align-items: center; justify-content: center; gap: 0.35rem;
    white-space: nowrap;
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .btn-reroll:active { background: rgba(255,255,255,0.14); }
  .btn-embed-toggle {
    background: var(--glass-bg); color: var(--ink-dim); border-color: var(--line);
    padding: 0.65rem 0.8rem; border-radius: 500px; white-space: nowrap;
  }
  .btn-embed-toggle[aria-pressed="true"] {
    background: linear-gradient(180deg, #6ee7b7, #10b981);
    border-color: transparent; color: var(--on-accent);
  }
  body.no-yt-embed .btn-embed-toggle { display: none; }
  .ios-yt-note {
    margin: 0; font-size: 0.72rem; color: var(--ink-dim); line-height: 1.4;
  }
  .ios-yt-note[hidden] { display: none; }
  .install-hint {
    margin: 0.75rem 0 0;
    background: var(--panel);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid rgba(167, 139, 250, 0.35);
    color: var(--ink);
    border-radius: 1rem;
    padding: 0.75rem 0.9rem;
    font-size: 0.82rem;
    line-height: 1.45;
    box-shadow: var(--glow-purple);
  }
  .install-hint[hidden] { display: none; }

  /* ── 搜尋欄 ── */
  .search { position: relative; margin-top: 1.1rem; }
  .search-ico {
    position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%);
    width: 1rem; height: 1rem; fill: var(--ink-dim); pointer-events: none;
  }
  .search input {
    width: 100%; font-family: inherit; font-size: 16px;
    background: var(--panel);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 0.8rem 2.6rem 0.8rem 2.45rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .search input::placeholder { color: var(--ink-dim); }
  .search input:focus { outline: none; border-color: rgba(167, 139, 250, 0.55); box-shadow: var(--glow-purple); }
  .search-clear {
    position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--ink-dim);
    font-size: 1.2rem; padding: 0.3rem 0.5rem;
    min-height: 44px; min-width: 44px;
  }

  /* ── 標籤分類組 ── */
  .group { margin-top: 1.35rem; }
  .group-head { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.6rem; }
  .group-label {
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(226, 232, 240, 0.72);
  }
  .group-hint { font-size: 0.68rem; color: rgba(167, 139, 250, 0.7); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .chip {
    background: var(--glass);
    background-color: var(--glass-bg);
    color: var(--ink);
    border: 1px solid var(--glass-border, var(--line));
    border-radius: 999px;
    padding: 0.38rem 0.35rem 0.38rem 0.85rem;
    font-size: 0.88rem;
    display: inline-flex; align-items: center;
    min-height: 40px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.16);
  }
  .chip .n {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 0.68rem; font-weight: 600; color: var(--ink);
    margin-left: 0.4rem;
    min-width: 1.45rem; height: 1.3rem; padding: 0 0.4rem;
    border-radius: 999px;
    background: rgba(0,0,0,0.28);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chip[aria-pressed="true"] {
    background: linear-gradient(180deg, rgba(110, 231, 183, 0.38), rgba(16, 185, 129, 0.18));
    border-color: rgba(110, 231, 183, 0.65);
    color: #ecfdf5; font-weight: 700;
    box-shadow: var(--glow-green), inset 0 1px 0 rgba(255,255,255,0.28);
  }
  .chip[aria-pressed="true"] .n {
    background: rgba(2, 44, 34, 0.35); color: #ecfdf5; opacity: 1;
  }
  .chip:disabled { opacity: 0.28; cursor: not-allowed; }

  .reset-btn {
    margin-top: 1rem; background: none; border: none;
    color: var(--ink-dim); font-size: 0.85rem;
    padding: 0.3rem 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }

  /* ── 收錄歌曲預覽列表 ── */
  .preview { margin-top: 1.5rem; padding-top: 0.25rem; }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.7rem;
  }
  .preview-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(226, 232, 240, 0.72);
  }
  .track {
    display: flex; gap: 0.75rem; align-items: flex-start;
    padding: 0.8rem 0.85rem;
    margin-bottom: 0.45rem;
    background: var(--glass-bg);
    border: 1px solid var(--line);
    border-radius: 1rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .track-num {
    font-family: var(--mono); font-size: 0.72rem; color: rgba(167, 139, 250, 0.7);
    min-width: 1.5rem; text-align: right; padding-top: 0.2rem;
  }
  .track-body { flex: 1; min-width: 0; }
  .track-title { font-size: 0.92rem; font-weight: 600; line-height: 1.35; word-break: break-word; letter-spacing: -0.01em; }
  .track-artist { font-size: 0.78rem; color: var(--ink-dim); margin-top: 0.15rem; }
  .track-tags { display: flex; flex-wrap: wrap; gap: 0.28rem; margin-top: 0.4rem; }
  .tag-badge {
    font-size: 0.68rem; padding: 0.18rem 0.5rem; border-radius: 999px;
    background: rgba(255,255,255,0.06); color: var(--ink-dim);
    border: 1px solid var(--line);
    cursor: pointer; font-family: inherit; display: inline-block;
    transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .tag-badge:hover { background: rgba(255,255,255,0.12); color: var(--ink); }
  .tag-badge.key { color: #c4b5fd; border-color: rgba(167, 139, 250, 0.4); }
  .tag-badge.active {
    background: linear-gradient(180deg, rgba(110, 231, 183, 0.4), rgba(16, 185, 129, 0.22));
    color: #ecfdf5; border-color: rgba(110, 231, 183, 0.6); font-weight: 700;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.28);
  }
  .tag-badge.key.active { color: #ecfdf5; }

  /* ── 底部內嵌播放器 ── */
  .mini-player {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(7, 6, 14, 0.62);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border-top: 1px solid var(--line);
    padding: 0.75rem max(1rem, env(safe-area-inset-right, 0px)) max(0.75rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
    box-shadow: 0 -16px 40px rgba(0,0,0,0.45);
  }
  .mini-player[hidden],
  body.no-yt-embed .mini-player { display: none !important; }
  .mini-inner {
    max-width: 36rem; margin: 0 auto;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .player-frame-box {
    width: 56px; height: 38px; background: #000; border-radius: 0.55rem; overflow: hidden; flex: none;
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
  }
  .player-frame-box iframe { width: 100%; height: 100%; border: none; }
  .player-meta { flex: 1; min-width: 0; }
  .player-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-sub { font-size: 0.72rem; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-ctrls { display: flex; gap: 0.35rem; align-items: center; flex: none; }
  .btn-ctrl {
    background: var(--glass-bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 50%; width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
    min-height: 44px;
  }
  .btn-switch-sheet {
    background: var(--glass-bg); border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 999px;
    padding: 0.2rem 0.65rem; font-size: 0.72rem; cursor: pointer;
    min-height: 32px;
    display: inline-flex; align-items: center; gap: 0.25rem;
    transition: background 0.15s, color 0.15s;
  }
  .btn-switch-sheet[hidden] { display: none; }
  .btn-switch-sheet:hover { background: rgba(255,255,255,0.12); color: var(--ink); }
  @media (max-width: 400px) {
    .dial-num { font-size: 1.85rem; }
    .btn-play { font-size: 0.88rem; }
    .fx-orb-a { width: 16rem; height: 16rem; }
    .fx-orb-b { width: 18rem; height: 18rem; }
  }
</style>

<div class="readout">
  <div class="readout-inner">
    <div class="dial-row">
      <div class="dial">
        <span class="dial-num zero" id="count">0</span>
        <span class="dial-unit">首選取</span>
      </div>
      <div class="dial-side">
        <div class="dial-stat" id="total-stat">載入中...</div>
        <button class="btn-switch-sheet" id="btn-switch-sheet" hidden title="清除連線，重新輸入試算表">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11v3l4-4-4-4v3H5v6h2V7zm10 10H6v-3l-4 4 4 4v-3h13v-6h-2v4z"/></svg>
          切換
        </button>
      </div>
    </div>
    <div class="actions">
      <button class="btn-play" id="btn-yt" disabled>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72L19 12 8 5.14z"/></svg>
        YouTube 播放
        <span class="count-pill" id="play-count">0</span>
      </button>
      <button class="btn-reroll" id="btn-reroll" style="display:none;" title="符合超過50首，隨機換下一批">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h8V3l-3.35 3.35z"/></svg>
        換一批
      </button>
      <button class="btn-embed-toggle" id="btn-embed" aria-pressed="false" title="在網頁內嵌播放器播放">
        內嵌
      </button>
    </div>
    <p class="ios-yt-note" id="ios-yt-note" hidden>iPhone 無法在網頁內嵌 YouTube，點播放會改開 YouTube App。</p>
  </div>
</div>

<div class="wrap">
  <!-- 連線設定區域（若無 Sheet ID 則顯示） -->
  <div class="gate" id="gate">
    <div class="gate-title">連接你的 Google 試算表</div>
    <div class="gate-body">
      把試算表<strong style="color:var(--ink); font-weight:600;">完整網址</strong>貼上，系統會自動取出 ID。也可以只填 ID。請先設為「知道連結的使用者可檢視」。
    </div>
    <label class="gate-label" for="input-sheet-url">完整網址</label>
    <input type="text" id="input-sheet-url" class="gate-input" inputmode="url" autocomplete="off" spellcheck="false"
      placeholder="https://docs.google.com/spreadsheets/d/……/edit">
    <label class="gate-label" for="input-sheet-id">試算表 ID</label>
    <input type="text" id="input-sheet-id" class="gate-input" autocomplete="off" spellcheck="false"
      placeholder="貼上網址後會自動填入，也可直接輸入">
    <div class="extracted-hint" id="extracted-hint" hidden></div>
    <div class="gate-actions">
      <button class="btn-primary" id="btn-connect">連接試算表</button>
      <button class="btn-subtle" id="btn-reset-sheet" hidden>清除設定</button>
    </div>
    <div id="gate-msg" style="margin-top:0.6rem; font-size:0.8rem; color:var(--brass);"></div>
  </div>
  <div class="install-hint" id="ios-install" hidden>
    用 Safari 打開此頁 → 點底部分享 →「加入主畫面」，就能像 App 一樣使用。
  </div>

  <!-- 關鍵字即時搜尋 -->
  <div class="search">
    <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="search" id="search-input" placeholder="搜尋歌名、歌手、頻道或標籤...">
    <button class="search-clear" id="search-clear" hidden>×</button>
  </div>

  <!-- 分類篩選按鈕群組 -->
  <div id="groups"></div>

  <button class="reset-btn" id="btn-clear-filters" hidden>清除全部篩選條件</button>

  <!-- 曲目預覽 -->
  <div class="preview">
    <div class="list-head">
      <div class="preview-label">目前過濾曲目清單 (<span id="preview-count">0</span>)</div>
    </div>
    <div id="track-list"></div>
  </div>
</div>

<!-- 底部內嵌 Mini Player -->
<div class="mini-player" id="mini-player" hidden>
  <div class="mini-inner">
    <div class="player-frame-box" id="player-mount"></div>
    <div class="player-meta">
      <div class="player-title" id="now-title">點唱機就緒</div>
      <div class="player-sub" id="now-artist">選取曲目開始播放</div>
    </div>
    <div class="player-ctrls">
      <button class="btn-ctrl" id="btn-prev" title="上一首">⏮</button>
      <button class="btn-ctrl" id="btn-toggle" title="播放/暫停">▶</button>
      <button class="btn-ctrl" id="btn-next" title="下一首">⏭</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  const LS_KEY = "music_jukebox_sheet_id";
  const LS_GID_KEY = "music_jukebox_sheet_gid";
  const PLAY_CAP = 50;

  // 標準分類定義（當試算表標頭包含時自動分類）
  const DEFAULT_TAXONOMY = {
    "語言": ["中文", "英文", "日文", "韓文", "粵語", "純音樂", "其他"],
    "男女歌手": ["男歌手", "女歌手", "男女合唱", "樂團/組合", "純音樂"],
    "年代": ["70s以前", "80s", "90s", "2000s", "2010s", "2020s"],
    "曲風": ["流行", "搖滾", "爵士", "Indie", "電子", "R&B", "古典", "嘻哈/饒舌", "民謠", "ACG"],
    "心情": ["放鬆", "嗨歌", "悲傷", "浪漫", "振奮", "療癒", "孤獨"],
    "情境": ["開車", "工作", "運動", "睡前", "派對", "通勤"]
  };

  const SINGLE_CATS = new Set();

  let state = {
    allSongs: [],
    categories: {}, // { "語言": ["中文", "英文"...] }
    selectedTags: new Set(),
    searchQuery: "",
    matchingSongs: [],
    active50: [],
    inAppMode: false,
    currentPlayingIndex: 0
  };

  // DOM 元素
  const gateEl = document.getElementById("gate");
  const sheetUrlEl = document.getElementById("input-sheet-url");
  const sheetInputEl = document.getElementById("input-sheet-id");
  const extractedHintEl = document.getElementById("extracted-hint");
  const connectBtn = document.getElementById("btn-connect");
  const resetSheetBtn = document.getElementById("btn-reset-sheet");
  const switchSheetBtn = document.getElementById("btn-switch-sheet");
  const gateMsgEl = document.getElementById("gate-msg");
  const iosInstallEl = document.getElementById("ios-install");
  const iosYtNoteEl = document.getElementById("ios-yt-note");

  const countEl = document.getElementById("count");
  const playCountEl = document.getElementById("play-count");
  const totalStatEl = document.getElementById("total-stat");
  const btnYt = document.getElementById("btn-yt");
  const btnReroll = document.getElementById("btn-reroll");
  const btnEmbed = document.getElementById("btn-embed");
  const searchInput = document.getElementById("search-input");
  const searchClear = document.getElementById("search-clear");
  const groupsEl = document.getElementById("groups");
  const clearFiltersBtn = document.getElementById("btn-clear-filters");
  const trackListEl = document.getElementById("track-list");
  const previewCountEl = document.getElementById("preview-count");

  // Mini Player DOM
  const miniPlayerEl = document.getElementById("mini-player");
  const playerMount = document.getElementById("player-mount");
  const nowTitle = document.getElementById("now-title");
  const nowArtist = document.getElementById("now-artist");
  const btnPrev = document.getElementById("btn-prev");
  const btnToggle = document.getElementById("btn-toggle");
  const btnNext = document.getElementById("btn-next");

  function isIOSDevice() {
    const ua = navigator.userAgent || "";
    return /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function isStandalonePWA() {
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
  }
  const noEmbedYouTube = isIOSDevice();
  if (noEmbedYouTube) {
    document.body.classList.add("no-yt-embed");
    btnEmbed.hidden = true;
    iosYtNoteEl.hidden = false;
  }
  if (isIOSDevice() && !isStandalonePWA()) {
    iosInstallEl.hidden = false;
  }

  function parseSheetInput(str) {
    const s = (str || "").trim();
    if (!s) return { id: "", gid: "" };
    const idMatch = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    const gidMatch = s.match(/[?#&]gid=([0-9]+)/) || s.match(/gid=([0-9]+)/);
    const gid = gidMatch ? gidMatch[1] : "";
    if (idMatch) return { id: idMatch[1], gid };
    return { id: s, gid };
  }

  function sheetUrlFromId(id, gid) {
    if (!id) return "";
    let u = "https://docs.google.com/spreadsheets/d/" + id + "/edit";
    if (gid) u += "?gid=" + gid + "#gid=" + gid;
    return u;
  }

  function showExtractedHint(parsed) {
    if (!parsed.id) {
      extractedHintEl.hidden = true;
      extractedHintEl.textContent = "";
      return;
    }
    extractedHintEl.hidden = false;
    extractedHintEl.textContent = parsed.gid
      ? "已取出 ID：" + parsed.id + "　工作表 gid：" + parsed.gid
      : "已取出 ID：" + parsed.id;
  }

  function onUrlFieldChange() {
    const parsed = parseSheetInput(sheetUrlEl.value);
    if (parsed.id && /\/spreadsheets\/d\//.test(sheetUrlEl.value)) {
      sheetInputEl.value = parsed.id;
      showExtractedHint(parsed);
    } else if (parsed.id && parsed.id === sheetUrlEl.value.trim()) {
      sheetInputEl.value = parsed.id;
      extractedHintEl.hidden = true;
    }
  }

  sheetUrlEl.addEventListener("input", onUrlFieldChange);
  sheetUrlEl.addEventListener("paste", () => setTimeout(onUrlFieldChange, 0));
  sheetInputEl.addEventListener("input", () => {
    const parsed = parseSheetInput(sheetInputEl.value);
    if (parsed.id && /\/spreadsheets\/d\//.test(sheetInputEl.value)) {
      sheetInputEl.value = parsed.id;
      sheetUrlEl.value = sheetUrlEl.value.trim() || sheetUrlFromId(parsed.id, parsed.gid);
      showExtractedHint(parsed);
    }
  });

  // 1. 初始化與參數讀取
  const urlParams = new URLSearchParams(window.location.search);
  const paramRaw = urlParams.get("url") || urlParams.get("id") || "";
  const savedId = localStorage.getItem(LS_KEY) || "";
  const savedGid = localStorage.getItem(LS_GID_KEY) || "";
  const bootParsed = paramRaw ? parseSheetInput(paramRaw) : { id: savedId, gid: savedGid };

  if (bootParsed.id) {
    sheetInputEl.value = bootParsed.id;
    sheetUrlEl.value = /\/spreadsheets\/d\//.test(paramRaw)
      ? paramRaw
      : sheetUrlFromId(bootParsed.id, bootParsed.gid);
    showExtractedHint(bootParsed);
    loadSheet(bootParsed.id, bootParsed.gid);
  }

  connectBtn.addEventListener("click", () => {
    const fromUrl = parseSheetInput(sheetUrlEl.value);
    const fromId = parseSheetInput(sheetInputEl.value);
    const id = fromUrl.id && /\/spreadsheets\/d\//.test(sheetUrlEl.value)
      ? fromUrl.id
      : (fromId.id || fromUrl.id);
    const gid = fromUrl.gid || fromId.gid || "";
    if (!id) {
      showGateMsg("請貼上試算表完整網址，或輸入 ID", true);
      return;
    }
    sheetInputEl.value = id;
    if (!sheetUrlEl.value.trim()) sheetUrlEl.value = sheetUrlFromId(id, gid);
    showExtractedHint({ id, gid });
    loadSheet(id, gid);
  });

  function doSwitchSheet() {
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_GID_KEY);
    sheetInputEl.value = "";
    sheetUrlEl.value = "";
    extractedHintEl.hidden = true;
    resetSheetBtn.hidden = true;
    switchSheetBtn.hidden = true;
    gateEl.style.display = "";
    if (isIOSDevice() && !isStandalonePWA()) iosInstallEl.hidden = false;
    connectBtn.disabled = false;
    showGateMsg("已清除連線，請重新貼上試算表網址");
  }

  resetSheetBtn.addEventListener("click", doSwitchSheet);
  switchSheetBtn.addEventListener("click", doSwitchSheet);

  function showGateMsg(txt, isErr) {
    gateMsgEl.textContent = txt;
    gateMsgEl.style.color = isErr ? "var(--red)" : "var(--brass)";
  }

  // 2. 試算表載入引擎（官方 gviz 模式，零 Apps Script）
  async function loadSheet(sid, gid) {
    if (!sid) return;

    showGateMsg("正在連線試算表資料庫...");
    connectBtn.disabled = true;

    let gvizUrl = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(sid) + "/gviz/tq?tqx=out:json";
    if (gid) gvizUrl += "&gid=" + encodeURIComponent(gid);

    try {
      const resp = await fetch(gvizUrl);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const text = await resp.text();

      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");
      if (start === -1 || end === -1) throw new Error("無效的試算表回應");
      const json = JSON.parse(text.substring(start, end + 1));

      parseGvizData(json);
      localStorage.setItem(LS_KEY, sid);
      if (gid) localStorage.setItem(LS_GID_KEY, gid);
      else localStorage.removeItem(LS_GID_KEY);
      gateEl.style.display = "none";
      iosInstallEl.hidden = true;
      resetSheetBtn.hidden = false;
      switchSheetBtn.hidden = false;
    } catch (e) {
      console.error(e);
      showGateMsg("連線失敗：請確認試算表已開啟「知道連結的使用者可檢視」或「發布到網路」", true);
      connectBtn.disabled = false;
    }
  }

  function parseGvizData(json) {
    const table = json.table;
    if (!table || !table.cols || !table.rows) {
      showGateMsg("試算表內容為空", true);
      return;
    }

    // 優先用 cols[].label；若試算表未設欄標籤（label 全為空），
    // 則 fallback 取第一個 row 作為 header，並把該 row 從資料列中移除。
    let header = table.cols.map(c => (c.label || "").trim());
    let dataRows = table.rows;

    const hasLabel = header.some(h => h !== "");
    if (!hasLabel && dataRows.length > 0) {
      const firstRow = dataRows[0];
      if (firstRow && firstRow.c) {
        header = firstRow.c.map(cell => (cell && cell.v != null ? String(cell.v).trim() : ""));
        dataRows = dataRows.slice(1); // 移除 header row，避免當成歌曲資料
      }
    }

    const colIdx = {};
    header.forEach((name, i) => { if (name) colIdx[name] = i; });

    if (!("videoId" in colIdx)) {
      showGateMsg("試算表缺少 videoId 欄位", true);
      return;
    }

    const songs = [];
    const usedTags = {};

    dataRows.forEach(r => {
      if (!r.c) return;
      const getVal = (name) => {
        const idx = colIdx[name];
        if (idx === undefined || !r.c[idx]) return "";
        return String(r.c[idx].v || "").trim();
      };

      const vid = getVal("videoId");
      if (!vid) return;
      if (getVal("非音樂").toUpperCase() === "Y") return;

      const title = getVal("歌名") || getVal("曲名") || "未命名曲目";
      const artist = getVal("歌手/原唱") || getVal("原唱") || getVal("歌手") || "";
      const channel = getVal("頻道") || "";

      // 擷取所有標籤
      const tags = [];
      Object.keys(DEFAULT_TAXONOMY).forEach(cat => {
        if (cat in colIdx) {
          const val = getVal(cat);
          if (val) {
            val.replace(/,/g, "、").split("、").forEach(t => {
              const cleaned = t.trim();
              if (cleaned && !tags.includes(cleaned)) {
                tags.push(cleaned);
                usedTags[cleaned] = (usedTags[cleaned] || 0) + 1;
              }
            });
          }
        }
      });

      // 支援任何其他非固定欄位標籤
      Object.keys(colIdx).forEach(cat => {
        if (!["videoId", "歌名", "曲名", "歌手/原唱", "原唱", "歌手", "頻道", "來源清單", "非音樂", "年份", "更新時間"].includes(cat) && !DEFAULT_TAXONOMY[cat]) {
          const val = getVal(cat);
          if (val) {
            val.replace(/,/g, "、").split("、").forEach(t => {
              const cleaned = t.trim();
              if (cleaned && !tags.includes(cleaned)) {
                tags.push(cleaned);
                usedTags[cleaned] = (usedTags[cleaned] || 0) + 1;
              }
            });
          }
        }
      });

      songs.push({
        id: vid,
        title: title,
        artist: artist,
        channel: channel,
        tags: tags
      });
    });

    state.allSongs = songs;

    // 建立可用的分類集合（僅保留有實際曲目出現的標籤）
    state.categories = {};
    Object.entries(DEFAULT_TAXONOMY).forEach(([cat, list]) => {
      const activeList = list.filter(t => usedTags[t]);
      if (activeList.length) {
        state.categories[cat] = activeList;
      }
    });

    // 額外自訂標籤
    const customTags = Object.keys(usedTags).filter(t => !Object.values(DEFAULT_TAXONOMY).some(list => list.includes(t)));
    if (customTags.length) {
      state.categories["自訂"] = customTags;
    }

    renderGroups();
    applyFilter();
  }

  // 3. 渲染篩選群組 UI
  function renderGroups() {
    groupsEl.innerHTML = "";
    Object.entries(state.categories).forEach(([cat, tags]) => {
      const g = document.createElement("div");
      g.className = "group";
      const head = document.createElement("div");
      head.className = "group-head";
      head.innerHTML = `<span class="group-label">${cat}</span><span class="group-hint">${SINGLE_CATS.has(cat) ? "單選" : "多選"}</span>`;
      g.appendChild(head);

      const chipsBox = document.createElement("div");
      chipsBox.className = "chips";

      tags.forEach(tag => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.dataset.cat = cat;
        btn.dataset.tag = tag;
        btn.setAttribute("aria-pressed", state.selectedTags.has(tag) ? "true" : "false");
        btn.innerHTML = `${tag}<span class="n" id="chip-n-${encodeURIComponent(tag)}">0</span>`;

        btn.addEventListener("click", () => toggleTag(cat, tag));
        chipsBox.appendChild(btn);
      });

      g.appendChild(chipsBox);
      groupsEl.appendChild(g);
    });
  }

  function toggleTag(cat, tag) {
    if (state.selectedTags.has(tag)) {
      state.selectedTags.delete(tag);
    } else {
      // 若為單選類別，先移除該類別其他標籤
      if (SINGLE_CATS.has(cat)) {
        (state.categories[cat] || []).forEach(t => state.selectedTags.delete(t));
      }
      state.selectedTags.add(tag);
    }
    updateChipsUI();
    applyFilter();
  }

  function updateChipsUI() {
    document.querySelectorAll(".chip").forEach(chip => {
      const tag = chip.dataset.tag;
      chip.setAttribute("aria-pressed", state.selectedTags.has(tag) ? "true" : "false");
    });
    clearFiltersBtn.hidden = state.selectedTags.size === 0 && !state.searchQuery;
  }

  clearFiltersBtn.addEventListener("click", () => {
    state.selectedTags.clear();
    state.searchQuery = "";
    searchInput.value = "";
    searchClear.hidden = true;
    updateChipsUI();
    applyFilter();
  });

  // 4. 關鍵字搜尋事件
  searchInput.addEventListener("input", (e) => {
    state.searchQuery = e.target.value.trim().toLowerCase();
    searchClear.hidden = !state.searchQuery;
    clearFiltersBtn.hidden = state.selectedTags.size === 0 && !state.searchQuery;
    applyFilter();
  });

  searchClear.addEventListener("click", () => {
    state.searchQuery = "";
    searchInput.value = "";
    searchClear.hidden = true;
    clearFiltersBtn.hidden = state.selectedTags.size === 0;
    applyFilter();
  });

  // 5. 核心過濾邏輯（類別間 AND，類別內 OR）
  function applyFilter() {
    const selected = Array.from(state.selectedTags);
    const q = state.searchQuery;

    // 將選取的標籤依類別分組
    const catPicks = {};
    selected.forEach(t => {
      for (const [cat, tags] of Object.entries(state.categories)) {
        if (tags.includes(t)) {
          catPicks[cat] = catPicks[cat] || [];
          catPicks[cat].push(t);
          break;
        }
      }
    });

    const activeCats = Object.values(catPicks);

    state.matchingSongs = state.allSongs.filter(song => {
      // 關鍵字搜尋匹配
      if (q) {
        const text = `${song.title} ${song.artist} ${song.channel} ${song.tags.join(" ")}`.toLowerCase();
        if (!text.includes(q)) return false;
      }

      // 標籤篩選：必須滿足每一個有選取標籤的類別（類別間 AND，類別內 OR）
      for (const groupTags of activeCats) {
        const hasAnyInGroup = groupTags.some(t => song.tags.includes(t));
        if (!hasAnyInGroup) return false;
      }
      return true;
    });

    // 隨機抽選 50 首作為播放目標
    shuffle50();
    updateCounts();
    renderTrackList();
  }

  function shuffle50() {
    const pool = [...state.matchingSongs];
    // Fisher-Yates shuffle
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.active50 = pool.slice(0, PLAY_CAP);
  }

  btnReroll.addEventListener("click", () => {
    shuffle50();
    renderTrackList();
    if (state.inAppMode) {
      loadInAppVideo(0);
    }
  });

  // 6. 介面計數更新
  function updateCounts() {
    const count = state.matchingSongs.length;
    countEl.textContent = count;
    countEl.className = "dial-num" + (count === 0 ? " zero" : "");
    playCountEl.textContent = Math.min(count, PLAY_CAP);
    previewCountEl.textContent = count;
    totalStatEl.textContent = `媒體庫總計 ${state.allSongs.length} 首`;

    btnYt.disabled = count === 0;
    btnReroll.style.display = count > PLAY_CAP ? "flex" : "none";

    // 更新每個 Chip 上的預估匹配數
    document.querySelectorAll(".chip").forEach(chip => {
      const tag = chip.dataset.tag;
      const countForTag = state.allSongs.filter(s => s.tags.includes(tag)).length;
      const badge = document.getElementById(`chip-n-${encodeURIComponent(tag)}`);
      if (badge) badge.textContent = countForTag;
    });
  }

  // 7. 渲染曲目列表
  function renderTrackList() {
    trackListEl.innerHTML = "";
    if (state.matchingSongs.length === 0) {
      trackListEl.innerHTML = `<div style="color:var(--ink-dim); padding:1rem 0; font-size:0.9rem;">沒有符合條件的曲目，請嘗試減少篩選標籤。</div>`;
      return;
    }

    const showList = state.matchingSongs.slice(0, 100);
    showList.forEach((song, idx) => {
      const row = document.createElement("div");
      row.className = "track";

      // 建立 tag 反查表：tag → cat
      const tagToCat = {};
      Object.entries(state.categories).forEach(([cat, tags]) => {
        tags.forEach(t => { tagToCat[t] = cat; });
      });

      const trackBody = document.createElement("div");
      trackBody.className = "track-body";
      trackBody.innerHTML = `
        <div class="track-title">${song.title}</div>
        <div class="track-artist">${song.artist || song.channel}</div>
      `;

      const trackTags = document.createElement("div");
      trackTags.className = "track-tags";

      song.tags.forEach(t => {
        const isKey = ["中文", "英文", "日文", "韓文", "粵語", "純音樂"].includes(t) || t.endsWith("s");
        const isActive = state.selectedTags.has(t);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `tag-badge ${isKey ? "key" : ""} ${isActive ? "active" : ""}`.trim();
        btn.textContent = t;
        btn.addEventListener("click", (e) => {
          e.stopPropagation(); // 不觸發播放
          const cat = tagToCat[t] || "__other__";
          toggleTag(cat, t);
        });
        trackTags.appendChild(btn);
      });

      trackBody.appendChild(trackTags);

      const trackNum = document.createElement("div");
      trackNum.className = "track-num";
      trackNum.textContent = idx + 1;

      row.appendChild(trackNum);
      row.appendChild(trackBody);

      row.addEventListener("click", () => {
        playSingleSong(song.id, song.title, song.artist || song.channel);
      });

      trackListEl.appendChild(row);
    });

    if (state.matchingSongs.length > 100) {
      const more = document.createElement("div");
      more.style.cssText = "text-align:center; padding:0.8rem; color:var(--ink-dim); font-size:0.8rem;";
      more.textContent = `...另有 ${state.matchingSongs.length - 100} 首未在預覽中列出`;
      trackListEl.appendChild(more);
    }
  }

  // 8. 播放模式 A：YouTube App 臨時歌單 (watch_videos)
  function openExternal(url) {
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function youtubeWatchUrl(vid) {
    return "https://www.youtube.com/watch?v=" + encodeURIComponent(vid);
  }

  function youtubeQueueUrl(ids) {
    return "https://www.youtube.com/watch_videos?video_ids=" + ids.map(encodeURIComponent).join(",");
  }

  btnYt.addEventListener("click", () => {
    if (!state.active50.length) return;
    openExternal(youtubeQueueUrl(state.active50.map(s => s.id)));
  });

  // 9. 播放模式 B：網頁內嵌播放器（iPhone / iOS PWA 無法內嵌，改開 YouTube App）
  btnEmbed.addEventListener("click", () => {
    if (noEmbedYouTube) return;
    state.inAppMode = !state.inAppMode;
    btnEmbed.setAttribute("aria-pressed", state.inAppMode ? "true" : "false");
    miniPlayerEl.hidden = !state.inAppMode;
    if (state.inAppMode && state.active50.length) {
      loadInAppVideo(0);
    }
  });

  function playSingleSong(vid, title, artist) {
    if (noEmbedYouTube) {
      openExternal(youtubeWatchUrl(vid));
      return;
    }
    state.inAppMode = true;
    btnEmbed.setAttribute("aria-pressed", "true");
    miniPlayerEl.hidden = false;
    nowTitle.textContent = title;
    nowArtist.textContent = artist;
    const src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(vid) + "?autoplay=1&enablejsapi=1&playsinline=1";
    playerMount.innerHTML = "";
    const frame = document.createElement("iframe");
    frame.src = src;
    frame.allow = "autoplay; encrypted-media";
    frame.allowFullscreen = true;
    playerMount.appendChild(frame);
  }

  function loadInAppVideo(index) {
    if (!state.active50.length) return;
    if (noEmbedYouTube) {
      const s = state.active50[(index + state.active50.length) % state.active50.length];
      openExternal(youtubeWatchUrl(s.id));
      return;
    }
    state.currentPlayingIndex = (index + state.active50.length) % state.active50.length;
    const s = state.active50[state.currentPlayingIndex];
    nowTitle.textContent = s.title;
    nowArtist.textContent = s.artist || s.channel;
    const src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(s.id) + "?autoplay=1&enablejsapi=1&playsinline=1";
    playerMount.innerHTML = "";
    const frame = document.createElement("iframe");
    frame.src = src;
    frame.allow = "autoplay; encrypted-media";
    frame.allowFullscreen = true;
    playerMount.appendChild(frame);
  }

  btnNext.addEventListener("click", () => loadInAppVideo(state.currentPlayingIndex + 1));
  btnPrev.addEventListener("click", () => loadInAppVideo(state.currentPlayingIndex - 1));
  btnToggle.addEventListener("click", () => {
    loadInAppVideo(state.currentPlayingIndex);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

})();
</script>
</body>
</html>
